<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>成语 Monsters</title>
  <style>
    :root { --bg:#0e0a09; --ink:#f3e9d2; --gold:#e0b65a; --red:#c0392b;
      --sans:"Segoe UI","SF Pro Text","Helvetica Neue",Arial,"Noto Sans",sans-serif;
      --hanzi:"KaiTi","Kaiti SC","STKaiti","Noto Serif SC","Songti SC","Microsoft YaHei",serif; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
      min-height:100vh; overflow-x:hidden; user-select:none; -webkit-user-select:none; }
    header { display:flex; justify-content:space-between; padding:12px 18px; font-size:15px; font-weight:600; }
    nav { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
    nav button, .btn { background:#2b211e; color:var(--ink); border:1px solid var(--gold); border-radius:999px;
      padding:8px 18px; font:inherit; font-size:14px; cursor:pointer; transition:transform .1s, background .15s; }
    nav button:hover, .btn:hover:not(:disabled) { transform:translateY(-1px); background:#3a2c27; }
    nav button.active, .btn.primary { background:var(--gold); color:#1a1210; font-weight:700; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    main { max-width:640px; margin:0 auto; padding:0 16px 40px; text-align:center; }
    .hanzi { font-family:var(--hanzi); }
    .dim { opacity:.6; font-size:13px; }
    .sleep { font-size:72px; margin:40px 0 8px; }
    #stage { position:relative; width:100%; height:calc(100vh - 210px); min-height:420px; max-height:760px;
      border-radius:20px; overflow:hidden; box-shadow:0 0 0 1px #3a2c27; }
    .stage-hint { position:absolute; left:0; right:0; bottom:22px; text-align:center; letter-spacing:.35em;
      font-size:13px; font-weight:700; color:var(--gold); pointer-events:none; transition:opacity .3s;
      animation:pulse 1.6s ease-in-out infinite; text-shadow:0 0 12px rgba(224,182,90,.6); }
    @keyframes pulse { 50% { opacity:.35; } }
    .stage-hint.off { animation:none; opacity:0; }
    #after { min-height:96px; padding-top:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
    .mini { border:2px solid var(--c); border-radius:12px; padding:10px 4px; background:#1b1412; }
    .mini.locked { filter:grayscale(1) brightness(.4); border-color:#444; }
    .mini .art { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; display:block; margin-bottom:4px; }
    .h { text-align:left; margin:18px 0 4px; font-size:13px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; }
    .problems { text-align:left; max-width:640px; margin:0 auto 10px; background:#3a1a14; border:1px solid #c0392b; border-radius:10px; padding:8px 14px; font-size:13px; }
    .problems summary { cursor:pointer; font-weight:600; } .problems li { margin:4px 0; }
    .mini .m { font-size:36px; } .mini .t { font-size:20px; margin:2px 0; } .mini .s { font-size:11px; opacity:.7; }
    .shop-row { display:flex; justify-content:space-between; align-items:center; text-align:left; background:#1f1715;
      border:1px solid #3a2c27; border-radius:12px; padding:12px 16px; margin:10px 0; }
    .shop-row small { opacity:.65; font-size:11px; }
    .boot { text-align:center; padding:30vh 20px 0; color:var(--gold); letter-spacing:.2em; font-size:13px; animation:pulse 1.6s ease-in-out infinite; }
    .src { text-align:center; font-size:11px; opacity:.45; padding:0 16px 24px; }
    .src.warn { opacity:.85; color:#e8b04a; }
    .toast { min-height:22px; color:var(--gold); margin:6px 0; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/boot.ts"></script>
</body>
</html>
