<style>
  /* Layout: a gallery of your cards with an editing drawer that slides in from the right and one Publish button in the top bar.
     Palette: ink and rice paper, one vermilion seal colour for the primary action. Rarity colours only ever mark rarity. */
  :root {
    --bg:#eceee9; --surface:#f8f9f6; --surface2:#e1e5dd; --line:#c9cfc3; --fg:#1d211e; --muted:#59635b;
    --accent:#b3261e; --accent-fg:#ffffff; --ok:#1d7a44; --warn:#8f5700; --bad:#b3261e; --focus:#1a5fb4; --shadow:rgba(20,30,25,.18);
    --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --brush:"Ma Shan Zheng","KaiTi","Kaiti SC","STKaiti",serif;
    --hanzi:"KaiTi","Kaiti SC","STKaiti","Noto Serif SC","Microsoft YaHei",serif;
    --c-common:#a99868; --c-uncommon:#3f9f4a; --c-rare:#2f7fd6; --c-epic:#8f4fd8; --c-legendary:#d98a00;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#14100f; --surface:#1e1816; --surface2:#2a201d; --line:#3d302b; --fg:#f1e8d4; --muted:#ab9d8c; --shadow:rgba(0,0,0,.5);
    --accent:#e5604a; --accent-fg:#1a0d0a; --ok:#6fcf8e; --warn:#e8b04a; --bad:#ff8f7c; --focus:#8ab8ff;
    --c-common:#d8c8a0; --c-uncommon:#5fd068; --c-rare:#4aa3ff; --c-epic:#b872ff; --c-legendary:#ffb62e; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg:#14100f; --surface:#1e1816; --surface2:#2a201d; --line:#3d302b; --fg:#f1e8d4; --muted:#ab9d8c; --shadow:rgba(0,0,0,.5);
    --accent:#e5604a; --accent-fg:#1a0d0a; --ok:#6fcf8e; --warn:#e8b04a; --bad:#ff8f7c; --focus:#8ab8ff;
    --c-common:#d8c8a0; --c-uncommon:#5fd068; --c-rare:#4aa3ff; --c-epic:#b872ff; --c-legendary:#ffb62e; color-scheme: dark; }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 var(--ui); padding-block:0 60px;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  h1,h2,h3,p { margin:0; }
  button,input,textarea,select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .wrap { max-width:1180px; margin:0 auto; transition:padding .2s; }
  @media (min-width:1100px) { body.drawer-open .wrap { padding-right:470px; } }

  .bar { display:flex; align-items:center; gap:14px; padding-block:14px; flex-wrap:wrap; position:sticky; top:env(safe-area-inset-top, 0px); background:var(--bg); z-index:5; border-bottom:1px solid var(--line); }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10; }
  .brand { display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand .cn { font-family:var(--brush); font-size:28px; color:var(--accent); line-height:1; }
  .brand b { font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .folder { display:inline-flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .folder .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
  .folder .dot.off { background:var(--warn); }
  .linkish { background:none; border:0; padding:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; }

  .btn { appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; font-weight:500; line-height:1.2; }
  .btn:hover { background:var(--surface2); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.small { padding:5px 10px; font-size:12.5px; } .btn.danger { color:var(--bad); }
  .btn[aria-disabled="true"], .btn:disabled { opacity:.45; pointer-events:none; }
  .count { background:var(--accent-fg); color:var(--accent); border-radius:999px; font-size:12px; padding:0 7px; font-weight:700; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding-block:16px 6px; }
  .search { flex:1 1 220px; min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px 12px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; font-size:12.5px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .chip[aria-pressed="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dot, var(--muted)); display:inline-block; flex:none; }
  .hint { color:var(--muted); font-size:12.5px; }

  /* gallery of cards */
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(164px, 1fr)); gap:14px; padding-block:12px 0; }
  .tile { --c:#d8c8a0; appearance:none; text-align:center; cursor:pointer; border:2px solid var(--c); border-radius:14px; padding:8px 8px 10px; position:relative;
    background:linear-gradient(165deg,#2a201c,#120d0c); color:#f3e9d2; display:grid; gap:7px; transition:transform .12s, box-shadow .12s; }
  .tile:hover { transform:translateY(-3px); box-shadow:0 10px 26px -10px var(--c); }
  .tile[aria-current="true"] { box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--c); }
  .tile.drop { transform:scale(1.03); box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
  .tile .pic { aspect-ratio:652/520; border-radius:9px; overflow:hidden; display:grid; place-items:center; font-size:56px; line-height:1;
    background:radial-gradient(circle at 50% 55%, color-mix(in srgb,var(--c) 55%,transparent), #0a0706 70%); }
  .tile .pic img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .hz { font-family:var(--hanzi); font-size:21px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .nm { font-size:11.5px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .flag { position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:999px; background:var(--accent); color:var(--accent-fg); }
  .tile .flag.warn { background:var(--warn); color:#1a0d0a; }
  .tile.add { background:transparent; border:2px dashed var(--line); color:var(--muted); min-height:150px; align-content:center; font-weight:500; }
  .tile.add:hover { color:var(--fg); border-color:var(--fg); box-shadow:none; }
  .empty { color:var(--muted); padding:30px 4px; }

  /* drawer */
  .drawer { position:fixed; top:0; bottom:0; right:0; width:min(450px,100vw); background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 40px -18px var(--shadow);
    transform:translateX(105%); transition:transform .22s ease; z-index:20; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top, 0px); }
  body.drawer-open .drawer { transform:none; }
  .drawer .head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); gap:8px; }
  .drawer .head h2 { font-size:15px; font-weight:600; }
  .drawer .body { overflow:auto; padding:16px; display:grid; gap:18px; flex:1; align-content:start; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px)); }
  .x { border:0; background:transparent; font-size:20px; width:34px; height:34px; border-radius:8px; cursor:pointer; } .x:hover { background:var(--surface2); }
  .savestate { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .savestate.ok { color:var(--ok); } .savestate.bad { color:var(--warn); }
  .cardwrap { container-type:inline-size; width:100%; max-width:230px; margin-inline:auto; }
  .card { --c:#d8c8a0; width:100%; aspect-ratio:2/3; border-radius:7cqw; border:1cqw solid var(--c);
    background:linear-gradient(165deg,#2a201c,#120d0c); color:#f3e9d2; padding:6cqw 6cqw 5cqw; display:flex; flex-direction:column; align-items:center; gap:2.4cqw;
    box-shadow:0 0 6cqw -1cqw var(--c), 0 10px 30px rgba(0,0,0,.25); overflow:hidden; text-align:center; }
  .card .nm { font-weight:600; font-size:5cqw; min-height:6cqw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card .art { width:100%; aspect-ratio:652/520; flex:none; border-radius:4.5cqw; border:.7cqw solid var(--c); display:grid; place-items:center; overflow:hidden; font-size:34cqw; line-height:1;
    background:radial-gradient(circle at 50% 55%, color-mix(in srgb,var(--c) 60%,transparent), color-mix(in srgb,var(--c) 14%,#0a0706) 55%, #0a0706); }
  .card .art img { width:100%; height:100%; object-fit:cover; }
  .card .st { color:var(--c); font-size:4.4cqw; letter-spacing:.2em; }
  .card .hz { font-family:var(--hanzi); font-size:min(14cqw, calc(62cqw / var(--n,4))); white-space:nowrap; text-shadow:0 0 5cqw var(--c); line-height:1.1; }
  .card .py { color:var(--c); font-style:italic; font-size:4.6cqw; }
  .card .mn { font-size:4.1cqw; color:#e6dcc4; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .ph { opacity:.4; }

  .drop-zone { border:2px dashed var(--line); border-radius:12px; padding:14px; display:grid; gap:10px; justify-items:center; text-align:center; background:var(--bg); cursor:pointer; }
  .drop-zone:hover, .drop-zone.over { border-color:var(--accent); }
  .drop-zone b { font-weight:600; }
  .drop-zone .meta { display:flex; align-items:center; gap:12px; text-align:left; }
  .drop-zone img { width:72px; height:58px; object-fit:cover; border-radius:7px; }
  .fix { border:1px solid var(--warn); color:var(--warn); border-radius:9px; padding:8px 10px; font-size:12.5px; display:grid; gap:6px; }

  .field { display:grid; gap:5px; min-width:0; }
  .field label, .field .lab { font-weight:600; font-size:13px; }
  .in { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:9px 11px; min-width:0; }
  .in.hz { font-family:var(--hanzi); font-size:22px; padding:6px 11px; }
  textarea.in { min-height:76px; resize:vertical; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .seg { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .seg button { border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:8px 2px; cursor:pointer; font-size:12px; font-weight:500; display:grid; gap:4px; justify-items:center; }
  .seg button[aria-pressed="true"] { border-color:var(--dot); box-shadow:inset 0 0 0 1px var(--dot); background:var(--surface2); font-weight:600; }
  .emojis { display:flex; flex-wrap:wrap; gap:3px; }
  .emojis button { border:1px solid transparent; background:var(--bg); border-radius:8px; width:34px; height:34px; font-size:19px; cursor:pointer; } .emojis button:hover { border-color:var(--line); }
  .check { display:flex; gap:8px; align-items:flex-start; } .check input { margin-top:3px; }
  details.more > summary { cursor:pointer; font-weight:600; font-size:13px; padding:4px 0; }
  details.more[open] > summary { margin-bottom:10px; }
  .msgs { margin:0; padding:0; list-style:none; display:grid; gap:4px; font-size:12.5px; }
  .msgs li { padding-left:16px; position:relative; } .msgs li::before { content:"!"; position:absolute; left:2px; font-weight:700; }
  .msgs.bad { color:var(--bad); } .msgs.warn { color:var(--warn); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; }

  .tabs { display:inline-flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px; }
  .tabs button { border:0; background:transparent; padding:6px 16px; border-radius:8px; font-weight:500; cursor:pointer; }
  .tabs button[aria-pressed="true"] { background:var(--surface); box-shadow:0 1px 3px var(--shadow); font-weight:600; }
  .gallery.packs { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  .ptile { --pc:#a3261e; appearance:none; border:0; cursor:pointer; position:relative; aspect-ratio:3/4; border-radius:12px; padding:20px 12px 16px; color:#f6e3b8; display:grid; grid-template-rows:auto 1fr auto auto; justify-items:center; align-items:center; gap:8px; overflow:hidden;
    background:linear-gradient(155deg, var(--pc), color-mix(in srgb, var(--pc) 42%, #000)); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--pc) 35%, #f6d58a), 0 8px 20px -10px var(--pc); transition:transform .12s; text-align:center; }
  .ptile::before, .ptile::after { content:""; position:absolute; left:0; right:0; height:9px; background:repeating-linear-gradient(90deg, rgba(0,0,0,.3) 0 2px, transparent 2px 5px); }
  .ptile::before { top:0; } .ptile::after { bottom:0; }
  .ptile:hover { transform:translateY(-3px); } .ptile.static:hover { transform:none; }
  .ptile[aria-current="true"] { box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--pc); }
  .ptile .tag { font-size:11px; font-weight:700; background:rgba(0,0,0,.38); padding:2px 9px; border-radius:999px; }
  .ptile .ico { font-size:54px; line-height:1; } .ptile .pn { font-weight:600; font-size:14px; line-height:1.2; }
  .ptile .pdesc { font-size:11.5px; opacity:.85; line-height:1.3; }
  .ptile.add { background:transparent; color:var(--muted); box-shadow:none; border:2px dashed var(--line); align-content:center; grid-template-rows:auto auto; font-weight:500; }
  .ptile.add::before, .ptile.add::after { display:none; } .ptile.add:hover { color:var(--fg); border-color:var(--fg); }
  .ptile.static { max-width:190px; width:100%; margin-inline:auto; cursor:default; }
  .oddsbar { display:flex; height:6px; border-radius:99px; overflow:hidden; background:rgba(0,0,0,.28); width:100%; min-width:40px; } .oddsbar i { display:block; min-width:0; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; } .sw { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25); }
  .sw[aria-pressed="true"] { border-color:var(--fg); }
  .in.colorin { padding:2px 4px; height:40px; cursor:pointer; }
  .odds { display:grid; gap:8px; }
  .odds-row { display:grid; grid-template-columns:10px 76px minmax(0,1fr) 64px 48px; gap:8px; align-items:center; font-size:13px; }
  .odds-row input[type="range"] { width:100%; accent-color:var(--accent); } .in.num { padding:5px 7px; text-align:right; } .pct { color:var(--muted); font-size:12px; text-align:right; }
  .seg3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .seg3 button { border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:8px 4px; cursor:pointer; font-size:12.5px; font-weight:500; }
  .seg3 button[aria-pressed="true"] { border-color:var(--fg); background:var(--surface2); font-weight:600; }
  .picklist { max-height:200px; overflow:auto; border:1px solid var(--line); border-radius:9px; background:var(--bg); display:grid; }
  .pick { display:grid; grid-template-columns:auto 10px auto minmax(0,1fr); gap:8px; align-items:center; padding:6px 10px; cursor:pointer; border-bottom:1px solid var(--line); }
  .pick:last-child { border-bottom:0; } .pick:hover { background:var(--surface2); } .pick .hz { font-family:var(--hanzi); font-size:16px; } .pick .hint { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* publish sheet + setup */
  .scrim { position:fixed; inset:0; background:rgba(10,8,7,.55); z-index:30; display:grid; place-items:center; padding:16px; }
  .sheet { background:var(--surface); border:1px solid var(--line); border-radius:16px; width:min(560px,100%); max-height:min(88vh,100%); overflow:auto; padding:20px; display:grid; gap:14px; box-shadow:0 30px 80px -20px var(--shadow); }
  .sheet h2 { font-size:18px; font-weight:600; }
  .changes { margin:0; padding:0; list-style:none; display:grid; gap:6px; }
  .changes li { display:flex; gap:10px; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .changes .hz { font-family:var(--hanzi); font-size:18px; } .changes .what { color:var(--muted); font-size:12.5px; text-align:right; }
  ol.steps { margin:0; padding:0; list-style:none; display:grid; gap:10px; }
  ol.steps li { display:flex; gap:10px; align-items:flex-start; }
  ol.steps .ic { width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--surface2); }
  ol.steps li.run .ic { border:2px solid var(--accent); border-top-color:transparent; background:transparent; animation:spin .8s linear infinite; }
  ol.steps li.ok .ic { background:var(--ok); color:var(--bg); } ol.steps li.bad .ic { background:var(--bad); color:var(--bg); }
  ol.steps .sub { color:var(--muted); font-size:12.5px; } pre.log { margin:6px 0 0; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; white-space:pre-wrap; word-break:break-word; max-height:160px; overflow:auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center { max-width:520px; margin:12vh auto 0; display:grid; gap:14px; text-align:center; justify-items:center; }
  .center h1 { font-size:22px; font-weight:600; } .center p { color:var(--muted); }
  .veil { position:fixed; inset:12px; z-index:40; border:2px dashed var(--accent); border-radius:18px; display:none; place-items:center; background:color-mix(in srgb, var(--bg) 86%, transparent); font-weight:600; font-size:18px; pointer-events:none; }
  body.dropping .veil { display:grid; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom, 0px)); background:var(--fg); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; max-width:92vw; text-align:center; }
  .toast.on { opacity:1; }
  @media (max-width:720px) { .odds-row { grid-template-columns:10px 64px minmax(0,1fr) 56px; } .odds-row .pct { display:none; } .two { grid-template-columns:minmax(0,1fr); } .seg { grid-template-columns:repeat(3,minmax(0,1fr)); } .gallery { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); } }
  @media (prefers-reduced-motion: reduce) { .drawer, .toast, .tile, .wrap { transition:none; } ol.steps li.run .ic { animation:none; } }
</style>

    <div class="brand"><span class="cn" aria-hidden="true">卡坊</span><b>Card Workshop</b></div>

  async function runPublish(message) {
    S.busy = true;
    var steps = [{ t: 'Saving your changes', st: 'run' }, { t: 'Sending them to GitHub', st: '' }, { t: 'Building the game', st: '' }];
    var show = function () { var p = $('#progress'); if (p) p.innerHTML = stepList(steps); };
    $('#pubbtns').innerHTML = ''; show();
    var fail = function (i, sub, log) { steps[i].st = 'bad'; steps[i].sub = sub; steps[i].log = log; show(); S.busy = false; $('#pubbtns').innerHTML = '<button class="btn primary" type="button" data-act="go">Try again</button><button class="btn" type="button" data-act="cancel">Close</button>'; };
    try {
      var r = await D.exec('git add -A -- content'); if (r.code) return fail(0, 'git add failed.', r.stderr || r.stdout);

    if (on) on.textContent = t ? (eu ? 'About 1 pack in ' + Math.max(1, Math.round(t / eu)) + ' has an epic or legendary card.' : 'This pack never gives epic or legendary cards.') : '';
    var pool = poolOf(p), pn = $('#poolnote');
    if (pn) pn.textContent = pool.length + ' card' + (pool.length === 1 ? '' : 's') + ' can come out: ' + RAR.map(function (r) { var n = pool.filter(function (c) { return c.rarity === r.k; }).length; return n ? n + ' ' + r.k : ''; }).filter(Boolean).join(' · ') + '.';
    var v = packValidate(p), m = $('#pmsgs');
    if (m) m.innerHTML = (v.errors.length ? '<ul class="msgs bad">' + v.errors.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + (v.warns.length ? '<ul class="msgs warn">' + v.warns.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '');
  }
  function touchedPack(p, immediate) {
    renderPackLive(p); renderBar();
    var v = packValidate(p);
    if (v.errors.length) { setPackSave('bad', 'Not saved yet: ' + v.errors[0]); renderPacks(); return; }
    setPackSave('', S.mode === 'desktop' ? 'Saving…' : '');
    clearTimeout(S.packT);
    S.packT = setTimeout(async function () {
      try { p.saved = true; await saveCfg(); setPackSave(S.mode === 'desktop' ? 'ok' : '', S.mode === 'desktop' ? '✓ Saved in your project folder' : ''); scheduleRefresh(); }
      catch (e) { say('Couldn\'t save: ' + (e.message || e)); }
      renderPacks(); renderBar();
    }, immediate ? 0 : 500);
  }
  function newPack() {
    if (!S.cfg) return; var n = S.cfg.packs.length;
    var p = normCfg({ packs: [{ id: '', name: '', cost: 100, icon: '🎁', color: PACK_COLORS[(n + 1) % PACK_COLORS.length], weights: clone(PRESETS[1].w) }] }).packs[0]; p.saved = false;
    S.cfg.packs.push(p); openPackDrawer(p.uid); setTimeout(function () { var el = $('#pk-name'); if (el) el.focus(); }, 60);
  }
  var packRemoveArmed = 0;
  async function removePack(p) {
    var btn = $('#drawer [data-pact="remove"]');
    if (!p.saved) { S.cfg.packs = S.cfg.packs.filter(function (x) { return x !== p; }); closeDrawer(); say('Draft discarded.'); renderBar(); return; }
    if (S.cfg.dailyPack === p.id) { say('This is the daily pack. Open another pack and tick "The free daily pack" first.'); return; }
    if (S.cfg.packs.length <= 1) { say('You need at least one pack.'); return; }
    if (packRemoveArmed !== p.uid) { packRemoveArmed = p.uid; if (btn) btn.textContent = 'Click again: remove ' + p.name + ' from the game'; setTimeout(function () { if (packRemoveArmed === p.uid) { packRemoveArmed = 0; if (btn) btn.textContent = 'Remove pack'; } }, 4000); return; }
    packRemoveArmed = 0; S.cfg.packs = S.cfg.packs.filter(function (x) { return x !== p; });
    try { await saveCfg(); } catch (e) { say('Couldn\'t save: ' + (e.message || e)); return; }
    closeDrawer(); scheduleRefresh(); renderBar(); say('Pack removed. Publish to remove it from the game.');
  }
  function makeDaily(p) {
    var old = S.cfg.packs.filter(function (x) { return x.id === S.cfg.dailyPack; })[0], note = '';
    S.cfg.dailyPack = p.id; p.cost = 0;
    if (old && old !== p && old.cost === 0) { old.cost = 60; note = ' ' + old.name + ' now costs 60 ink so it can be sold in the shop.'; }
    renderPackDrawer(true); touchedPack(p, true); if (note) say(p.name + ' is now the free daily pack.' + note);
  }

  document.addEventListener('click', async function (e) {
    var t = e.target.closest('[data-view],[data-pid],[data-pact],[data-picon],[data-pcolor],[data-ppreset],[data-pmode],[data-ptag]'); if (!t) return;
    var p = cur2();
    if (t.dataset.view) { if (S.view !== t.dataset.view) { S.view = t.dataset.view; closeDrawer(); renderAll(); } return; }
    if (t.dataset.pid) { openPackDrawer(t.dataset.pid); return; }
    if (t.dataset.pact === 'new') { newPack(); return; }
    if (t.dataset.pact === 'copy-cfg') { try { await navigator.clipboard.writeText(cfgText()); say('game.json copied. Paste it into GitHub\'s editor.'); } catch (err) { say('Couldn\'t copy it here.'); } return; }
    if (t.dataset.pact === 'mark-cfg') { S.cfgBaseText = cfgText(); renderBar(); openPublishAgain(); return; }
    if (!p) return;
    if (t.dataset.pact === 'remove') { removePack(p); return; }
    if (t.dataset.pact === 'daily') return;   // handled by the checkbox's change event
    if (t.dataset.picon) { p.icon = t.dataset.picon; var ie = $('#pk-icon'); if (ie) ie.value = p.icon; touchedPack(p); return; }
    if (t.dataset.pcolor) { p.color = t.dataset.pcolor; var ce = $('#pk-color'); if (ce) ce.value = p.color; $('#drawer').querySelectorAll('[data-pcolor]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pcolor === p.color)); }); touchedPack(p); return; }
    if (t.dataset.ppreset !== undefined) { p.weights = clone(PRESETS[Number(t.dataset.ppreset)].w); renderPackDrawer(true); touchedPack(p, true); return; }
    if (t.dataset.pmode) {
      var m = t.dataset.pmode; p.mode = m; if (m === 'all') { delete p.tags; delete p.cards; } else if (m === 'tags') { delete p.cards; p.tags = p.tags || []; } else { delete p.tags; p.cards = p.cards || []; }
      var tmp = p; renderPackDrawer(true); $('#drawer').querySelectorAll('[data-pmode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pmode === m)); }); touchedPack(tmp, true); return;
    }
    if (t.dataset.ptag) { var tg = t.dataset.ptag; p.tags = p.tags || []; var i = p.tags.indexOf(tg); if (i >= 0) p.tags.splice(i, 1); else p.tags.push(tg); t.setAttribute('aria-pressed', String(i < 0)); if (!p.tags.length) delete p.tags; touchedPack(p); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target, p = cur2(); if (!p) return;
    if (t.dataset.pf) {
      var f = t.dataset.pf, v = t.value;
      if (f === 'cost') { p.cost = v === '' ? NaN : Number(v); }
      else if (f === 'name') { p.name = v; if (!p.saved) { p.id = uniquePackId(slug(v), p.uid); } }
      else p[f] = v;
      if (f === 'color') $('#drawer').querySelectorAll('[data-pcolor]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pcolor === (v || '').toLowerCase())); });
      touchedPack(p); return;
    }
    if (t.dataset.pw) {
      var k = t.dataset.pw, n = Math.max(0, Number(t.value) || 0); p.weights[k] = n;
      $('#drawer').querySelectorAll('[data-pw="' + k + '"]').forEach(function (el) { if (el !== t) el.value = el.type === 'range' ? Math.min(100, n) : n; });
      touchedPack(p); return;
    }
    if (t.dataset.psearch !== undefined) { var q = t.value.trim().toLowerCase(); $('#drawer').querySelectorAll('.pick').forEach(function (el) { el.hidden = !!q && el.dataset.hay.indexOf(q) < 0; }); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, p = cur2(); if (!p) return;
    if (t.dataset.pcard !== undefined) { p.cards = p.cards || []; var id = t.dataset.pcard, i = p.cards.indexOf(id); if (t.checked && i < 0) p.cards.push(id); else if (!t.checked && i >= 0) p.cards.splice(i, 1); touchedPack(p); }
    else if (t.dataset.pact === 'daily' && t.checked) makeDaily(p);
  });

  boot();
})();
</script>
